    <!--
      Pre-paint appearance bootstrap.
      Keep storage key, class name, and resolve rules in sync with src/lib/appearance.ts.
      Inline only — ESM imports cannot run before first paint.
    -->
    <script>
      ;(function () {
        var STORAGE_KEY = 'portfolio-appearance-override'
        var DARK_CLASS = 'dark'
        var QUERY = '(prefers-color-scheme: dark)'
        try {
          var override = null
          try {
            var raw = sessionStorage.getItem(STORAGE_KEY)
            if (raw === 'light' || raw === 'dark') override = raw
          } catch (e) {}
          var prefersDark = false
          try {
            prefersDark =
              typeof matchMedia === 'function' && matchMedia(QUERY).matches
          } catch (e) {}
          var mode = override || (prefersDark ? 'dark' : 'light')
          document.documentElement.classList.toggle(DARK_CLASS, mode === 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
